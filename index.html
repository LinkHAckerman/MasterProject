<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="MAGNUM OPUS - The Definitive All-Encompassing Web3, DeFi, NFT, and Multi-Chain Nexus Engine"/>
    <meta name="theme-color" content="#030611"/>
    <title>MAGNUM OPUS // Web3 & DeFi Nexus Engine</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

    <!-- Core Stylesheet -->
    <link rel="stylesheet" href="styles.css"/>

    <!-- Fallback & Critical Path Styles -->
    <style>
        :root {
            --bg-primary: #030611;
            --bg-secondary: #080c1e;
            --bg-card: rgba(10, 15, 36, 0.75);
            --border-color: rgba(56, 189, 248, 0.15);
            --border-glow: rgba(168, 85, 247, 0.25);
            --accent-cyan: #38bdf8;
            --accent-purple: #a855f7;
            --accent-emerald: #10b981;
            --accent-rose: #f43f5e;
            --accent-amber: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glow-cyan: 0 0 20px rgba(56, 189, 248, 0.4);
            --glow-purple: 0 0 20px rgba(168, 85, 247, 0.4);
            --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image:
                radial-gradient(circle at 10% 15%, rgba(168, 85, 247, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 90% 85%, rgba(56, 189, 248, 0.12) 0%, transparent 45%);
            background-attachment: fixed;
        }
    </style>
</head>
<body>
    <!-- Top Global Header -->
    <header id="main-header">
        <div class="logo-container">
            <div class="logo-icon" aria-hidden="true">Ω</div>
            <div>
                <span class="logo-text">MAGNUM OPUS</span>
                <span class="version-tag">v4.8.0-PRO</span>
            </div>
        </div>

        <div class="nav-metrics-bar">
            <div class="network-selector-wrapper">
                <span class="pulse-indicator active" id="network-status-dot"></span>
                <select id="network-select" class="styled-select" aria-label="Network Selector">
                    <option value="ethereum">Ethereum Mainnet</option>
                    <option value="arbitrum">Arbitrum One (L2)</option>
                    <option value="solana">Solana Cluster</option>
                    <option value="polygon">Polygon PoS</option>
                    <option value="avalanche">Avalanche C-Chain</option>
                </select>
            </div>

            <div class="gas-badge" id="gas-tracker" title="Real-time Base Gas Fee">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18M15 10h4a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-4"/><path d="M7 11h4M7 7h4"/></svg>
                <span id="gas-price">14.2 Gwei</span>
            </div>

            <div class="metric-pill block-height-pill" title="Latest Block Number">
                <span class="label">BLOCK:</span>
                <span id="block-height" class="mono-val">#19,842,912</span>
            </div>

            <div class="metric-pill tps-pill" title="Multi-Chain Engine Compute Throughput">
                <span class="label">TPS:</span>
                <span id="engine-tps" class="mono-val">4,280 /s</span>
            </div>
        </div>

        <div class="nav-actions">
            <button id="sound-toggle-btn" class="icon-btn" aria-label="Toggle Web Audio FX" title="Toggle Synthesizer Feedback">
                <svg id="sound-icon-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
            </button>

            <button id="open-settings-btn" class="icon-btn" aria-label="Platform Settings" title="Settings">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09a1.65 1.65 0 0 0-1.51-1.51H5a2 2 0 0 1-2-2v-1.5a1.65 1.65 0 0 0-1.51-1.51H1a2 2 0 0 1-2-2v-2a2 2 0 0 1 2-2h.09a1.65 1.65 0 0 0 1.51-1.51V5a2 2 0 0 1 2-2h1.5a1.65 1.65 0 0 0 1.51-1.51V1a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1.51 1.51H15a2 2 0 0 1 2 2v1.5a1.65 1.65 0 0 0 1.51 1.51H21a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1.51V15z"/></svg>
            </button>
        </div>
    </header>

    <!-- Main Dashboard -->
    <main id="dashboard" class="dashboard-container">
        <section class="wallet-overview card">
            <h2 class="section-title">Wallet Overview</h2>
            <div class="wallet-stats">
                <div class="stat-item">
                    <span class="stat-label">Balance</span>
                    <span class="stat-value" id="wallet-balance">0.00 ETH</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">USD Value</span>
                    <span class="stat-value" id="wallet-usd">$0.00</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Connected Chain</span>
                    <span class="stat-value" id="wallet-chain">Ethereum</span>
                </div>
            </div>
        </section>

        <section class="market-data card">
            <h2 class="section-title">Market Snapshot</h2>
            <canvas id="price-chart" width="800" height="300"></canvas>
        </section>

        <section class="activity-feed card">
            <h2 class="section-title">Recent Activity</h2>
            <ul id="activity-list" class="activity-list">
                <li class="activity-item">Loading activity...</li>
            </ul>
        </section>
    </main>

    <!-- Settings Modal (hidden by default) -->
    <div id="settings-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div class="modal-content">
            <header class="modal-header">
                <h2 id="settings-title">Platform Settings</h2>
                <button id="close-settings-btn" class="icon-btn" aria-label="Close Settings">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </header>
            <section class="modal-body">
                <label class="toggle-label">
                    <input type="checkbox" id="theme-toggle" />
                    Dark Mode
                </label>
                <label class="toggle-label">
                    <input type="checkbox" id="notifications-toggle" />
                    Enable Notifications
                </label>
            </section>
            <footer class="modal-footer">
                <button id="save-settings-btn" class="primary-btn">Save</button>
                <button id="cancel-settings-btn" class="secondary-btn">Cancel</button>
            </footer>
        </div>
    </div>

    <!-- Footer -->
    <footer class="site-footer">
        <p>&copy; 2024 Magnum Opus. All rights reserved.</p>
        <nav class="footer-nav">
            <a href="#" aria-label="Documentation">Docs</a>
            <a href="#" aria-label="GitHub Repository">GitHub</a>
            <a href="#" aria-label="Community Discord">Discord</a>
        </nav>
    </footer>

    <!-- Core Scripts -->
    <script src="app.js" defer></script>
    <script>
        // Simple theme toggle logic
        const themeToggle = document.getElementById('theme-toggle');
        if (themeToggle) {
            const currentTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.dataset.theme = currentTheme;
            themeToggle.checked = currentTheme === 'dark';
            themeToggle.addEventListener('change', (e) => {
                const newTheme = e.target.checked ? 'dark' : 'light';
                document.documentElement.dataset.theme = newTheme;
                localStorage.setItem('theme', newTheme);
            });
        }
        // Settings modal handling
        const settingsBtn = document.getElementById('open-settings-btn');
        const settingsModal = document.getElementById('settings-modal');
        const closeSettingsBtn = document.getElementById('close-settings-btn');
        const cancelSettingsBtn = document.getElementById('cancel-settings-btn');
        const saveSettingsBtn = document.getElementById('save-settings-btn');
        if (settingsBtn && settingsModal) {
            const openModal = () => settingsModal.classList.remove('hidden');
            const closeModal = () => settingsModal.classList.add('hidden');
            settingsBtn.addEventListener('click', openModal);
            closeSettingsBtn.addEventListener('click', closeModal);
            cancelSettingsBtn.addEventListener('click', closeModal);
            saveSettingsBtn.addEventListener('click', () => {
                // Placeholder for persisting settings
                closeModal();
            });
        }
    </script>
</body>
</html>
