<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="MAGNUM OPUS - The Definitive All-Encompassing Web3, DeFi, NFT, and Multi-Chain Nexus Engine"/>
    <meta name="theme-color" content="#030611"/>
    <title>MAGNUM OPUS // Web3 & DeFi Nexus Engine</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

    <!-- Core Stylesheet -->
    <link rel="stylesheet" href="styles.css"/>

    <!-- Fallback & Critical Path Styles -->
    <style>
        :root {
            --bg-primary: #030611;
            --bg-secondary: #080c1e;
            --bg-card: rgba(10, 15, 36, 0.75);
            --border-color: rgba(56, 189, 248, 0.15);
            --border-glow: rgba(168, 85, 247, 0.25);
            --accent-cyan: #38bdf8;
            --accent-purple: #a855f7;
            --accent-emerald: #10b981;
            --accent-rose: #f43f5e;
            --accent-amber: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glow-cyan: 0 0 20px rgba(56, 189, 248, 0.4);
            --glow-purple: 0 0 20px rgba(168, 85, 247, 0.4);
            --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image:
                radial-gradient(circle at 10% 15%, rgba(168, 85, 247, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 90% 85%, rgba(56, 189, 248, 0.12) 0%, transparent 45%);
            background-attachment: fixed;
        }
    </style>
    <script defer src="app.js"></script>
</head>
<body>
    <!-- Top Global Header -->
    <header id="main-header">
        <div class="logo-container">
            <div class="logo-icon" aria-hidden="true">\u0329</div>
            <div>
                <span class="logo-text">MAGNUM OPUS</span>
                <span class="version-tag">v4.8.0-PRO</span>
            </div>
        </div>

        <div class="nav-metrics-bar">
            <div class="network-selector-wrapper">
                <span class="pulse-indicator active" id="network-status-dot"></span>
                <select id="network-select" class="styled-select" aria-label="Network Selector">
                    <option value="ethereum">Ethereum Mainnet</option>
                    <option value="arbitrum">Arbitrum One (L2)</option>
                    <option value="solana">Solana Cluster</option>
                    <option value="polygon">Polygon PoS</option>
                    <option value="avalanche">Avalanche C-Chain</option>
                </select>
            </div>

            <div class="gas-badge" id="gas-tracker" title="Real-time Base Gas Fee">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18M15 10h4a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-4"/><path d="M7 11h4M7 7h4"/></svg>
                <span id="gas-price">14.2 Gwei</span>
            </div>

            <div class="metric-pill block-height-pill" title="Latest Block Number">
                <span class="label">BLOCK:</span>
                <span id="block-height" class="mono-val">#19,842,912</span>
            </div>

            <div class="metric-pill tps-pill" title="Multi-Chain Engine Compute Throughput">
                <span class="label">TPS:</span>
                <span id="engine-tps" class="mono-val">4,280 /s</span>
            </div>
        </div>

        <div class="nav-actions">
            <button id="sound-toggle-btn" class="icon-btn" aria-label="Toggle Web Audio FX" title="Toggle Synthesizer Feedback">
                <svg id="sound-icon-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
            </button>

            <button id="open-settings-btn" class="icon-btn" aria-label="Platform Settings" title="Settings">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1"/></svg>
            </button>
        </div>
    </header>

    <!-- Main Dashboard -->
    <main id="dashboard">
        <section class="grid-container">
            <article class="card" id="wallet-card">
                <header class="card-header">
                    <h2>Wallet</h2>
                </header>
                <div class="card-body">
                    <p class="balance-label">Balance</p>
                    <p class="balance-value mono-val" id="wallet-balance">0.00 ETH</p>
                    <button class="action-btn" id="refresh-wallet-btn">Refresh</button>
                </div>
            </article>

            <article class="card" id="transactions-card">
                <header class="card-header">
                    <h2>Recent Transactions</h2>
                </header>
                <div class="card-body">
                    <ul class="tx-list" id="tx-list">
                        <li class="tx-item placeholder">Loading…</li>
                    </ul>
                </div>
            </article>

            <article class="card" id="market-card">
                <header class="card-header">
                    <h2>Market Overview</h2>
                </header>
                <div class="card-body">
                    <canvas id="market-chart" width="400" height="200"></canvas>
                </div>
            </article>

            <article class="card" id="staking-card">
                <header class="card-header">
                    <h2>Staking &amp; Yield</h2>
                </header>
                <div class="card-body">
                    <p class="placeholder">Coming soon…</p>
                </div>
            </article>
        </section>
    </main>

    <!-- Settings Modal (hidden by default) -->
    <div id="settings-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div class="modal-content">
            <header class="modal-header">
                <h2 id="settings-title">Platform Settings</h2>
                <button class="icon-btn" id="close-settings-btn" aria-label="Close Settings">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6L18 18M6 18L18 6"/></svg>
                </button>
            </header>
            <section class="modal-body">
                <label for="theme-select">Theme</label>
                <select id="theme-select">
                    <option value="dark">Dark (default)</option>
                    <option value="light">Light</option>
                </select>

                <label for="refresh-interval">Data Refresh Interval (seconds)</label>
                <input type="number" id="refresh-interval" min="5" max="60" step="5" value="15"/>
            </section>
        </div>
    </div>

    <!-- Footer -->
    <footer id="main-footer">
        <p>&copy; 2026 Magnum Opus. All rights reserved.</p>
        <nav class="footer-links">
            <a href="#" id="privacy-link">Privacy</a>
            <a href="#" id="terms-link">Terms</a>
            <a href="https://github.com/magnumopus" target="_blank" rel="noopener">GitHub</a>
        </nav>
    </footer>
</body>
</html>
