<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'/>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'/>
    <meta name='description' content='MAGNUM OPUS - The Definitive All-Encompassing Web3, DeFi, NFT, and Multi-Chain Nexus Engine'/>
    <meta name='theme-color' content='#030611'/>
    <title>MAGNUM OPUS // Web3 & DeFi Nexus Engine</title>
    <link rel='preconnect' href='https://fonts.googleapis.com'/>
    <link rel='preconnect' href='https://fonts.gstatic.com' crossorigin/>
    <link href='https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap' rel='stylesheet'/>
    <link rel='stylesheet' href='styles.css'/>
    <style>
        :root {
            --bg-primary: #030611;
            --bg-secondary: #080c1e;
            --bg-card: rgba(10, 15, 36, 0.75);
            --border-color: rgba(56, 189, 248, 0.15);
            --border-glow: rgba(168, 85, 247, 0.25);
            --accent-cyan: #38bdf8;
            --accent-purple: #a855f7;
            --accent-emerald: #10b981;
            --accent-rose: #f43f5e;
            --accent-amber: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glow-cyan: 0 0 20px rgba(56, 189, 248, 0.4);
            --glow-purple: 0 0 20px rgba(168, 85, 247, 0.4);
            --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); min-height: 100vh; overflow-x: hidden; background-image: radial-gradient(circle at 10% 15%, rgba(168, 85, 247, 0.12) 0%, transparent 45%), radial-gradient(circle at 90% 85%, rgba(56, 189, 248, 0.12) 0%, transparent 45%); background-attachment: fixed; }
    </style>
    <script defer src='app.js'></script>
</head>
<body>
    <header id='main-header'>
        <div class='logo-container'>
            <div class='logo-icon' aria-hidden='true'></div>
            <div>
                <span class='logo-text'>MAGNUM OPUS</span>
                <span class='version-tag'>v4.8.0-PRO</span>
            </div>
        </div>
        <div class='nav-metrics-bar'>
            <div class='network-selector-wrapper'>
                <span class='pulse-indicator active' id='network-status-dot'></span>
                <select id='network-select' class='styled-select' aria-label='Network Selector'>
                    <option value='ethereum'>Ethereum Mainnet</option>
                    <option value='arbitrum'>Arbitrum One (L2)</option>
                    <option value='solana'>Solana Cluster</option>
                    <option value='polygon'>Polygon PoS</option>
                    <option value='avalanche'>Avalanche C-Chain</option>
                </select>
            </div>
            <div class='gas-badge' id='gas-tracker' title='Real-time Base Gas Fee'>
                <svg width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.2'><path d='M3 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18M15 10h4a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-4'/><path d='M7 11h4M7 7h4'/></svg>
                <span id='gas-price'>14.2 Gwei</span>
            </div>
            <div class='metric-pill block-height-pill' title='Latest Block Number'>
                <span class='label'>BLOCK:</span>
                <span id='block-height' class='mono-val'>#19,842,912</span>
            </div>
            <div class='metric-pill tps-pill' title='Multi-Chain Engine Compute Throughput'>
                <span class='label'>TPS:</span>
                <span id='engine-tps' class='mono-val'>4,280 /s</span>
            </div>
        </div>
        <div class='nav-actions'>
            <button id='sound-toggle-btn' class='icon-btn' aria-label='Toggle Web Audio FX' title='Toggle Synthesizer Feedback'>
                <svg id='sound-icon-on' width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><polygon points='11 5 6 9 2 9 2 15 6 15 11 19 11 5'/><path d='M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07'/></svg>
            </button>
            <button id='open-settings-btn' class='icon-btn' aria-label='Platform Settings' title='Settings'>
                <svg width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><circle cx='12' cy='12' r='3'/><path d='M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2z'/></svg>
            </button>
        </div>
    </header>
    <main id='dashboard-container'>
        <aside id='sidebar'>
            <nav>
                <a href='#' class='nav-item active' data-section='overview'>Overview</a>
                <a href='#' class='nav-item' data-section='wallet'>Wallet</a>
                <a href='#' class='nav-item' data-section='swap'>Swap</a>
                <a href='#' class='nav-item' data-section='portfolio'>Portfolio</a>
                <a href='#' class='nav-item' data-section='nft'>NFTs</a>
                <a href='#' class='nav-item' data-section='stake'>Stake</a>
                <a href='#' class='nav-item' data-section='activity'>Activity</a>
            </nav>
        </aside>
        <section id='content-area'>
            <div id='overview-view'>
                <h1>Global Overview</h1>
                <div id='stats-grid'>
                    <div class='stat-card'><span class='stat-label'>Total Value Locked</span><span class='stat-value' id='tvl'>$84.2B</span></div>
                    <div class='stat-card'><span class='stat-label'>Active Wallets</span><span class='stat-value' id='active-wallets'>1.28M</span></div>
                    <div class='stat-card'><span class='stat-label'>NFT Volume</span><span class='stat-value' id='nft-volume'>12.4M ETH</span></div>
                    <div class='stat-card'><span class='stat-label'>Gas Saved</span><span class='stat-value' id='gas-saved'>98.6 Gwei</span></div>
                </div>
            </div>
        </section>
    </main>
    <div id='notification-center'></div>
    <div id='command-palette' class='modal-overlay hidden'>
        <div class='command-box'>
            <input id='command-input' type='text' placeholder='Search commands...' />
        </div>
    </div>
    <div id='settings-modal' class='modal-overlay hidden'>
        <div class='settings-panel'>
            <h2>Platform Settings</h2>
            <label>Theme</label>
            <select id='theme-select'>
                <option value='dark'>Dark</option>
                <option value='light'>Light</option>
            </select>
        </div>
    </div>
    <script src='https://cdn.jsdelivr.net/npm/chart.js'></script>
    <script src='app.js'></script>
</body>
</html>
