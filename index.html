<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAGNUM OPUS // Web3 & DeFi Nexus Engine</title>
    <style>
        :root {
            --bg-primary: #030611;
            --bg-secondary: #080c1e;
            --bg-card: rgba(10, 15, 36, 0.75);
            --border-color: rgba(56, 189, 248, 0.15);
            --border-glow: rgba(168, 85, 247, 0.25);
            --accent-cyan: #38bdf8;
            --accent-purple: #a855f7;
            --accent-emerald: #10b981;
            --accent-rose: #f43f5e;
            --accent-amber: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glow-cyan: 0 0 20px rgba(56, 189, 248, 0.4);
            --glow-purple: 0 0 20px rgba(168, 85, 247, 0.4);
            --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 15%, rgba(168, 85, 247, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 90% 85%, rgba(56, 189, 248, 0.12) 0%, transparent 45%);
            background-attachment: fixed;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: rgba(5, 8, 22, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            border-radius: 8px;
            box-shadow: var(--glow-cyan);
            display: grid;
            place-items: center;
            font-weight: 900;
            color: #fff;
            font-family: var(--font-mono);
            font-size: 1.1rem;
        }

        .logo-text {
            font-size: 1.35rem;
            font-weight: 900;
            letter-spacing: 2.5px;
            background: linear-gradient(to right, #fff, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 1.25rem;
        }

        .gas-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.25);
            color: var(--accent-emerald);
            padding: 0.45rem 0.9rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-family: var(--font-mono);
            font-weight: bold;
        }

        .btn-connect {
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
            border: none;
            color: white;
            padding: 0.6rem 1.4rem;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.85rem;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.2);
        }

        .btn-connect:hover {
            transform: translateY(-1px);
            box-shadow: var(--glow-purple);
        }

        .dashboard-container {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 1.5rem;
            padding: 2rem;
            max-width: 1600px;
            margin: 0 auto;
        }

        .main-workspace {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .metric-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.25rem;
        }

        .metric-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(8px);
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .metric-card:hover {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.1);
        }

        .metric-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent, var(--border-glow));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .metric-card:hover::before {
            opacity: 1;
        }

        /* Sidebar styling */
        .sidebar {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem;
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-container">
            <div class="logo-icon">M</div>
            <div class="logo-text">MAGNUM OPUS</div>
        </div>
        <div class="nav-actions">
            <div class="gas-badge" id="gasBadge">Gas: <span id="gasPrice">--</span> Gwei</div>
            <button class="btn-connect" id="connectBtn">Connect Wallet</button>
        </div>
    </header>

    <div class="dashboard-container">
        <div class="main-workspace">
            <div class="metric-grid" id="metrics">
                <div class="metric-card">
                    <h3>Balance</h3>
                    <p id="balance">0.00 ETH</p>
                </div>
                <div class="metric-card">
                    <h3>Portfolio Value</h3>
                    <p id="portfolioValue">$0.00</p>
                </div>
                <div class="metric-card">
                    <h3>Current Block</h3>
                    <p id="currentBlock">--</p>
                </div>
            </div>
        </div>
        <aside class="sidebar">
            <h3>Recent Transactions</h3>
            <ul id="txList"><li>No transactions</li></ul>
        </aside>
    </div>

    <script src="app.js"></script>
</body>
</html>
